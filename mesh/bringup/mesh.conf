# Settings shared by every node. Sourced by bash; keep it KEY=value.
# Installed to /etc/meshmap/mesh.conf by install.sh. All nodes must use the same values
# except the node id. Defaults match the units already deployed (mesh-net, ch 36, 10.10.0.N).

IFACE=wlan0
SSID=mesh-net
BSSID=02:ca:fe:ca:fe:01      # fixed BSSID: every node joins the same cell (IBSS cells with random BSSIDs can split)
FREQ_MHZ=5180                # ch 36. INDOOR-ONLY in Finland (5150-5250 MHz); for outdoor/flight use 2412 or 5745+ (check-node.sh warns)
HT_MODE=                     # empty, or HT20/NOHT. brcmfmac does not support HT in IBSS reliably, so leave empty there
TX_POWER_DBM=                # empty = driver default; brcmfmac may ignore or misreport it

SUBNET=10.10.0               # node N gets $SUBNET.N/$PREFIX_LEN on bat0
PREFIX_LEN=24
NODE_ID=                     # empty = trailing number of the hostname (raspberrypi2 -> 2)

ROUTING_ALGO=BATMAN_IV       # or BATMAN_V; fixed before bat0 is created, must match on all nodes
WLAN_MTU=1500                # brcmfmac cannot go above 1500
BAT_MTU=1400                 # leaves room for the 32 B batman-adv header and avoids fragmentation
DISTRIBUTED_ARP_TABLE=0      # 0 = off (existing deployment)
