# Single source of truth for scripts/*.sh and the linktest package.
# Relative paths are resolved against this file's directory.

# Radio and addressing come from the running mesh (mesh/bringup/mesh.conf); nothing here configures it.
# Traffic goes over bat0, RSSI/MCS/retries come from `iw station dump` on the underlying interface.
interface: wlan0
frequency_mhz: 5180          # must match FREQ_MHZ in mesh.conf (ch 36, indoor-only in FI); used by linkbudget only
tx_power_dbm: 15             # assumed, for linkbudget only: brcmfmac reports 31 dBm but may ignore the setting (verify)

# bat0 addresses (SUBNET.N from mesh.conf)
ips:
  pi1: 10.10.0.1             # fixed node, runs the collector and the iperf3 client
  pi2: 10.10.0.2             # moving node, runs scripts/start_server.sh

# Measurement
test:
  distances_m: [1, 5, 10, 20, 30, 40, 50, 60, 80, 100]
  settle_s: 30               # wait after the operator moves Pi 2
  duration_s: 30             # per traffic test; ping, TCP and UDP run one after another
  ping_interval_s: 0.2       # 0.2 s is the minimum for a non-root user
iperf:
  port: 5201
  udp_bitrate: 10M           # keep below link capacity so UDP loss reflects range, not congestion

output_dir: ../../../runs/linktest   # <output_dir>/<run_id>/ (runs/ is git-ignored)

# Usable range = last distance before the first step that fails either rule
analysis:
  throughput_fraction: 0.5   # fail if TCP goodput < fraction * goodput at the nearest distance
  loss_threshold_pct: 10     # fail if UDP or ping loss exceeds this

# Theoretical link budget
linkbudget:
  tx_antenna_gain_dbi: 0.0   # onboard PCB antenna, verify
  rx_antenna_gain_dbi: 0.0
  cable_loss_db: 0.0
  path_loss_exponent: 3.0    # ~2 free space, 2.7-3.5 near the ground, verify with analysis
  fade_margin_db: 10.0
  regulatory_eirp_limit_dbm: 20   # FI 2.4 GHz per `iw reg get`; check your own country
  # Receiver sensitivity at 20 MHz, IEEE 802.11n minimum levels (verify). Real chips are often 5-10 dB better.
  sensitivity_dbm:
    MCS0: -82
    MCS1: -79
    MCS2: -77
    MCS3: -74
    MCS4: -70
    MCS5: -66
    MCS6: -65
    MCS7: -64
